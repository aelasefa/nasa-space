name: Sync upstream main


on:
  schedule:
    - cron: '7,22,37,52 * * * *'

  workflow_dispatch:
  repository_dispatch:
    types: [upstream-main-updated]


permissions:
  contents: read


concurrency:
  group: sync-upstream-main
  cancel-in-progress: false


jobs:
  sync:
    if: github.repository == 'aelasefa/nasa-space'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sync credential
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::Add the SYNC_TOKEN repository secret. See .github/SYNC.md.'
            exit 1
          fi


      - name: Check out destination main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}


      - name: Merge upstream main and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mtourham/nasa-space.git
          git -c http.https://github.com/.extraheader= fetch --no-tags upstream main
          upstream_sha=$(git rev-parse FETCH_HEAD)


          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'main already contains all upstream updates.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi


          if ! git merge --no-edit "$upstream_sha"; then
            git merge --abort || true
            echo '::error::Cannot merge upstream automatically. Resolve conflicts or unrelated histories manually; no updates were pushed.'
            exit 1
          fi


          # A normal push also protects against concurrent changes to main.
          git push origin HEAD:main
          echo "Merged upstream commit $upstream_sha into main." >> "$GITHUB_STEP_SUMMARY"

