services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: luna01-backend:latest
    container_name: luna01-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 3s
      retries: 3
